name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Export web
        env:
          EXPO_PUBLIC_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          EXPO_PUBLIC_APPWRITE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_IOS_BUNDLE_ID: com.dzikle.universalstarter
          EXPO_PUBLIC_ANDROID_PACKAGE: com.dzikle.universalstarter
        run: npm run build:web

      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/initial-platform'
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock npm dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
